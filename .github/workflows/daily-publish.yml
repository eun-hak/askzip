name: daily-publish

# 예약 발행: 매일 아침 재빌드를 트리거해 publishedAt이 도래한 글을 공개한다.
# 글 노출 필터는 src/data/articles/index.ts 참조. 2026-10-31 이후엔 자동 중단.
on:
  schedule:
    - cron: '5 0 * * *' # 00:05 UTC = 09:05 KST
    - cron: '37 1 * * *' # 01:37 UTC = 10:37 KST — 스케줄러 지연 대비 백업 (중복 실행은 아래에서 무해 처리)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stop after final scheduled article (2026-10-31)
        id: guard
        run: |
          if [ "$(date -u +%F)" \> "2026-10-31" ]; then
            echo "expired=true" >> "$GITHUB_OUTPUT"
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit publish stamp to trigger deploy
        if: steps.guard.outputs.expired == 'false'
        run: |
          git config user.name "askzip-daily-publish"
          git config user.email "actions@users.noreply.github.com"
          date -u +%F > .publish-stamp
          if git diff --quiet -- .publish-stamp; then
            echo "already stamped today — nothing to do"
            exit 0
          fi
          git add .publish-stamp
          git commit -m "chore: daily publish rebuild ($(date -u +%F))"
          git push
